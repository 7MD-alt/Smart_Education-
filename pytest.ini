[pytest]
DJANGO_SETTINGS_MODULE = backend_core.settings
python_files = test_*.py
python_classes = *Tests *Test Test*
python_functions = test_*
testpaths = attendance/tests
# Keep test output focused; -p no:cacheprovider avoids a .pytest_cache in the repo.
addopts = -p no:cacheprovider --ds=backend_core.settings
filterwarnings =
    ignore::DeprecationWarning
